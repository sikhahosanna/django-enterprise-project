      responses:
        '200':
          description: Driver location updated successfully.
        '400':
          description: Invalid location data.
        '401':
          description: Authentication required.
        '404':
          description: Driver not found.
  /api/v1/drivers/nearby/:
    get:
      operationId: v1_drivers_nearby_retrieve
      description: Retrieve available drivers within the specified radius.
      summary: Find Nearby Drivers
      parameters:
      - in: query
        name: latitude
        schema:
          type: number
          format: double
        description: Pickup latitude.
        required: true
      - in: query
        name: longitude
        schema:
          type: number
          format: double
        description: Pickup longitude.
        required: true
      - in: query
        name: radius
        schema:
          type: number
          format: double
        description: Search radius in kilometers.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Nearby drivers retrieved successfully.
        '400':
          description: Invalid location or radius.
        '401':
          description: Authentication required.
  /api/v1/notifications/:
    get:
      operationId: v1_notifications_list
      description: Retrieve notifications belonging to the authenticated user.
