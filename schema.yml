components:
  schemas:
    AvailabilityStatusEnum:
      enum:
      - online
      - offline
      - busy
      type: string
      description: |-
        * `online` - Online
        * `offline` - Offline
        * `busy` - Busy
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
        provider:
          type: string
          format: uuid
        service:
          type: string
          format: uuid
        booking_date:
          type: string
          format: date
        booking_time:
          type: string
          format: time
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - booking_date
      - booking_time
      - created_at
      - customer
      - id
      - provider
      - service
      - status
      - updated_at
    BookingStatusEnum:
      enum:
      - pending
      - confirmed
      - in_progress
      - completed
      - cancelled
      - payment_failed
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `in_progress` - In Progress
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `payment_failed` - Payment Failed
    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          writeOnly: true
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          writeOnly: true
        last_name:
          type: string
          writeOnly: true
        phone:
          type: string
          writeOnly: true
        license_number:
          type: string
          maxLength: 50
        status:
          allOf:
          - $ref: '#/components/schemas/DriverStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - id
      - last_name
      - license_number
      - password
      - phone
      - status
      - updated_at
    DriverLocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        driver:
          type: string
          format: uuid
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        last_updated:
          type: string
          format: date-time
          readOnly: true
        availability_status:
          allOf:
          - $ref: '#/components/schemas/AvailabilityStatusEnum'
          readOnly: true
      required:
      - availability_status
      - driver
      - id
      - last_updated
      - latitude
      - longitude
    DriverNested:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        vehicle:
          type: string
          readOnly: true
      required:
      - id
      - name
      - vehicle
    DriverStatusEnum:
      enum:
      - active
      - inactive
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        ride:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        title:
          type: string
          readOnly: true
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        message:
          type: string
          maxLength: 255
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - notification_type
      - ride
      - title
      - user
    NotificationTypeEnum:
      enum:
      - ride_requested
      - ride_accepted
      - driver_arriving
      - ride_started
      - ride_completed
      - ride_cancelled
      - booking_created
      - payment_successful
      - booking_confirmed
      - provider_started
      - booking_completed
      - booking_cancelled
      type: string
      description: |-
        * `ride_requested` - Ride Requested
        * `ride_accepted` - Ride Accepted
        * `driver_arriving` - Driver Arriving
        * `ride_started` - Ride Started
        * `ride_completed` - Ride Completed
        * `ride_cancelled` - Ride Cancelled
        * `booking_created` - Booking Created
        * `payment_successful` - Payment Successful
        * `booking_confirmed` - Booking Confirmed
        * `provider_started` - Provider Started Service
        * `booking_completed` - Booking Completed
        * `booking_cancelled` - Booking Cancelled
    PaginatedDriverList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
